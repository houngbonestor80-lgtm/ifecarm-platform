<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2d7a44">
<title>Hors connexion — IFECARM GROUP</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11181c; color: #fff; font-family: Poppins, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.3rem; margin: 16px 0 8px; }
  p { color: #b9c4c9; line-height: 1.55; margin: 0 0 12px; }
  a, button { display: inline-block; margin: 6px 4px 0; padding: 12px 20px; border-radius: 10px; border: 1px solid #2d7a44; background: #2d7a44; color: #fff; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; min-height: 44px; box-sizing: border-box; }
  a.secondaire { background: transparent; color: #8fd1a2; }
</style>
</head>
<body>
<main>
  <img src="/brand/logo-circle.svg" alt="IFECARM GROUP">
  <h1>Pas de connexion</h1>
  <p>Cette page a besoin du réseau. Aucune donnée de l’entreprise n’est conservée sur cet appareil pour la consulter hors ligne.</p>
  <p>La saisie d’une déclaration du registre de sécurité reste possible : elle s’enverra au retour du réseau.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <a class="secondaire" href="/registre/nouvelle">Déclarer un incident</a>
</main>
</body>
</html>

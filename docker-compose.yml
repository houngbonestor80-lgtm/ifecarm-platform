services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_superuser_dev_only
      POSTGRES_DB: ifecarm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Rejoué automatiquement au tout premier démarrage du conteneur.
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ifecarm']
      interval: 2s
      timeout: 3s
      retries: 15

  stockage:
    # Stockage objet compatible S3 pour le DÉVELOPPEMENT uniquement (la
    # production utilise un vrai S3 via S3_REGION). MinIO a retiré ses images
    # publiques (quay.io : 401, Docker Hub : dépôt supprimé, constaté le
    # 29/09/2026) : remplacé par SeaweedFS, libre (Apache 2.0). Même API S3,
    # même port 9000 : .env et src/storage/s3.ts sont inchangés. Sans fichier
    # d'identités, SeaweedFS accepte toute clé (acceptable en local seulement).
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0
    ports:
      - '9000:9000' # API S3
    volumes:
      - stockagedata:/data

  courriel:
    # Boîte mail de DÉVELOPPEMENT : reçoit les e-mails sans rien envoyer (SMTP 1025, interface http://localhost:8025).
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web

volumes:
  pgdata:
  stockagedata:
